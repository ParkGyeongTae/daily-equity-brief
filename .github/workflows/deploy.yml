name: Deploy VitePress site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 한 번에 하나만. 진행 중인 배포는 취소하지 않는다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # lastUpdated가 git 커밋 시각을 읽으므로 전체 히스토리 필요
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # 커밋 훅은 에이전트 세션에서만 돈다. 훅을 거치지 않은 커밋도 형식이 깨진 채 공개되지 않게
      # 배포 전에 한 번 더 막는다. 표준 라이브러리만 쓰므로 러너의 python3로 충분하다.
      - name: Validate briefs
        run: python3 scripts/validate_brief.py briefs/*.md
      # 고쳤던 스크립트 버그가 되살아나지 않는지 본다. 네트워크를 쓰지 않는다.
      - name: Regression tests
        run: python3 -m unittest discover -s tests -v
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run docs:build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .vitepress/dist

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
